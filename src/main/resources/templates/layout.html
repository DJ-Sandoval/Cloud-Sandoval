<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Nube Sandoval'">Nube Sandoval</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/cloud.png">
    <link rel="shortcut icon" href="/img/cloud.png">

    <!-- Librerías externas (deben cargarse primero) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        dark: '#0f172a',
                        secondary: '#334155',
                        'gray-750': '#2d3748'
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }  /* ❌ Antes: opacity: 1); */
        }
        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        .animate-slide-down { animation: slideDown 0.2s ease-out; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .drop-zone {
            border: 2px dashed #4b5563;
            transition: all 0.3s ease;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            max-width: 400px;
        }

        /* Estilos adicionales para el preview de Excel */
        .excel-preview-table {
            font-size: 0.875rem;
        }
        .excel-preview-table td, .excel-preview-table th {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">

<!-- Toast Container -->
<div id="toastContainer" class="toast space-y-2"></div>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Layout con Sidebar -->
<div class="flex">
    <!-- Sidebar - Árbol de Directorios -->
    <aside id="treeSidebar" class="hidden lg:block w-64 bg-gray-800 border-r border-gray-700 min-h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto p-4">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
            <i class="fas fa-sitemap mr-2"></i>Árbol de Carpetas
        </h3>
        <div id="treeContent" class="text-sm">
            <!-- Se llena con JS -->
            <div class="animate-pulse space-y-2">
                <div class="h-4 bg-gray-700 rounded w-3/4"></div>
                <div class="h-4 bg-gray-700 rounded w-1/2 ml-4"></div>
                <div class="h-4 bg-gray-700 rounded w-2/3 ml-4"></div>
            </div>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 min-w-0">
        <div th:replace="${content}"></div>
    </main>
</div>

<!-- Modales -->
<div th:replace="~{fragments/modals :: modals}"></div>

<!-- Scripts (se cargan después de las librerías) -->
<div th:replace="~{fragments/scripts :: scripts}"></div>

<!-- Variables del Servidor -->
<script th:inline="javascript">
    window.serverData = {
        currentFolderId: /*[[${currentFolderId}]]*/ null,
        storageUsage: /*[[${storageUsage}]]*/ 0,
        apiBasePath: /*[[@{/}]]*/ '/'
    };

    // Verificar que SheetJS se cargó correctamente
    if (typeof XLSX === 'undefined') {
        console.error('SheetJS no se cargó correctamente');
    } else {
        console.log('SheetJS cargado correctamente, versión:', XLSX.version);
    }
</script>
</body>
</html>
