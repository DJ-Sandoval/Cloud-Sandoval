<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modals">

    <!-- Modal Subir Archivo Simple -->
    <div id="uploadModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-lg animate-fade-in shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center">
                    <i class="fas fa-cloud-upload-alt text-blue-400 mr-3"></i>Subir Archivo
                </h3>
                <button onclick="hideUploadModal()" class="text-gray-400 hover:text-white text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Drag & Drop Zone -->
            <div id="dropZone"
                 class="drop-zone border-2 border-dashed border-gray-600 rounded-lg p-8 mb-4 text-center cursor-pointer transition-all duration-200">
                <i class="fas fa-cloud-upload-alt text-4xl text-gray-500 mb-3"></i>
                <p class="text-gray-400 mb-2">Arrastra y suelta archivos aquí</p>
                <p class="text-gray-500 text-sm">o haz clic para seleccionar</p>
                <input type="file" id="fileInput" class="hidden" multiple
                       onchange="handleFileSelect(event)">
            </div>

            <!-- Lista de archivos seleccionados -->
            <div id="selectedFiles" class="mb-4 space-y-2 max-h-40 overflow-y-auto hidden">
                <h4 class="text-sm font-semibold text-gray-400 mb-2">Archivos seleccionados:</h4>
            </div>

            <!-- Etiquetas -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fas fa-tags mr-2"></i>Etiquetas (separadas por coma)
                </label>
                <input type="text" id="uploadTags"
                       class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500"
                       placeholder="importante, trabajo, personal">
            </div>

            <!-- Barra de progreso -->
            <div id="uploadProgress" class="mb-4 hidden">
                <div class="flex justify-between text-sm text-gray-400 mb-1">
                    <span id="uploadStatus">Subiendo...</span>
                    <span id="uploadPercentage">0%</span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-3">
                    <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-blue-400 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="chunkInfo" class="text-xs text-gray-500 mt-1 hidden"></div>
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="hideUploadModal()"
                        class="px-5 py-2 text-sm bg-gray-600 hover:bg-gray-700 rounded-lg transition duration-200">
                    Cancelar
                </button>
                <button onclick="uploadFilesSmart()" id="uploadBtn"
                        class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 rounded-lg transition duration-200 flex items-center">
                    <i class="fas fa-upload mr-2"></i>Subir
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Carpeta -->
    <div id="folderModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md animate-fade-in shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center">
                    <i class="fas fa-folder-plus text-purple-400 mr-3"></i>Nueva Carpeta
                </h3>
                <button onclick="hideFolderModal()" class="text-gray-400 hover:text-white text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">Nombre de la carpeta</label>
                <input type="text" id="folderName"
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-purple-500 text-white"
                       placeholder="Ingresa el nombre"
                       onkeypress="if(event.key === 'Enter') createFolder()">
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="hideFolderModal()"
                        class="px-5 py-2 text-sm bg-gray-600 hover:bg-gray-700 rounded-lg transition duration-200">
                    Cancelar
                </button>
                <button onclick="createFolder()"
                        class="px-5 py-2 text-sm bg-purple-600 hover:bg-purple-700 rounded-lg transition duration-200 flex items-center">
                    <i class="fas fa-plus mr-2"></i>Crear
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Renombrar -->
    <div id="renameModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md animate-fade-in shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white">Renombrar</h3>
                <button onclick="hideRenameModal()" class="text-gray-400 hover:text-white text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <input type="hidden" id="renameId">
            <input type="hidden" id="renameType">
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">Nuevo nombre</label>
                <input type="text" id="renameName"
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white"
                       onkeypress="if(event.key === 'Enter') executeRename()">
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="hideRenameModal()"
                        class="px-5 py-2 text-sm bg-gray-600 hover:bg-gray-700 rounded-lg transition duration-200">
                    Cancelar
                </button>
                <button onclick="executeRename()"
                        class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 rounded-lg transition duration-200">
                    Renombrar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Eliminación -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md animate-fade-in shadow-2xl">
            <div class="text-center mb-6">
                <i class="fas fa-exclamation-triangle text-yellow-500 text-5xl mb-4"></i>
                <h3 class="text-xl font-bold text-white mb-2" id="confirmTitle">¿Confirmar eliminación?</h3>
                <p id="confirmMessage" class="text-gray-400"></p>
            </div>
            <div class="flex justify-center space-x-4">
                <button onclick="hideConfirmModal()"
                        class="px-6 py-2 text-sm bg-gray-600 hover:bg-gray-700 rounded-lg transition duration-200">
                    Cancelar
                </button>
                <button onclick="executeDelete()"
                        class="px-6 py-2 text-sm bg-red-600 hover:bg-red-700 rounded-lg transition duration-200">
                    <i class="fas fa-trash mr-2"></i>Eliminar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Previsualización -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-4">
        <div class="relative w-full max-w-5xl max-h-[90vh] animate-fade-in">
            <!-- Barra superior -->
            <div class="absolute top-0 left-0 right-0 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent z-10 rounded-t-xl">
                <div class="flex items-center space-x-3">
                    <i id="previewIcon" class="fas fa-file text-white text-xl"></i>
                    <span id="previewName" class="text-white font-medium truncate max-w-md"></span>
                    <span id="previewSize" class="text-gray-400 text-sm"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <a id="previewDownload" href="#" class="text-blue-400 hover:text-blue-300 p-2" title="Descargar">
                        <i class="fas fa-download text-xl"></i>
                    </a>
                    <button onclick="hidePreviewModal()" class="text-white hover:text-gray-300 p-2">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>
            <!-- Contenido -->
            <div id="previewContent" class="flex items-center justify-center min-h-[60vh] rounded-xl overflow-hidden">
            </div>
            <!-- Navegación -->
            <button id="previewPrev" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 rounded-full p-3 text-white hidden">
                <i class="fas fa-chevron-left text-xl"></i>
            </button>
            <button id="previewNext" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 rounded-full p-3 text-white hidden">
                <i class="fas fa-chevron-right text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Menú Contextual -->
    <div id="contextMenu" class="fixed hidden z-[100] bg-gray-800 border border-gray-600 rounded-lg shadow-2xl py-2 min-w-[200px] animate-fade-in"
         style="top: 0; left: 0;">
        <!-- Se llena dinámicamente con JS -->
    </div>

    <!-- Barra de Acciones en Lote -->
    <div id="batchBar" class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-blue-600 transform translate-y-full transition-transform duration-300 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <span id="batchCount" class="text-white font-medium">0 seleccionados</span>
                <button onclick="clearSelection()" class="text-gray-400 hover:text-white text-sm">
                    <i class="fas fa-times mr-1"></i>Limpiar
                </button>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="batchDownload()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm flex items-center">
                    <i class="fas fa-download mr-2"></i>Descargar
                </button>
                <button onclick="batchMove()" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded-lg text-sm flex items-center">
                    <i class="fas fa-arrows-alt mr-2"></i>Mover
                </button>
                <button onclick="batchDelete()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm flex items-center">
                    <i class="fas fa-trash mr-2"></i>Eliminar
                </button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
