<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="bg-dark border-b border-blue-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <!-- Logo y Navegación -->
            <div class="flex items-center">
                <div class="flex-shrink-0 flex items-center">
                    <i class="fas fa-cloud text-blue-500 text-2xl mr-3"></i>
                    <span class="text-xl font-bold text-white">Nube Sandoval</span>
                </div>
                <div class="hidden md:ml-8 md:flex md:space-x-2">
                    <button onclick="navigateTo(null)"
                            class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 hover:bg-blue-700 transition duration-200 flex items-center">
                        <i class="fas fa-home mr-2"></i>Inicio
                    </button>
                    <button onclick="showUploadModal()"
                            class="px-4 py-2 rounded-lg text-sm font-medium bg-green-600 hover:bg-green-700 transition duration-200 flex items-center">
                        <i class="fas fa-file-upload mr-2"></i>Subir Archivo
                    </button>
                    <button onclick="showFolderModal()"
                            class="px-4 py-2 rounded-lg text-sm font-medium bg-purple-600 hover:bg-purple-700 transition duration-200 flex items-center">
                        <i class="fas fa-folder-plus mr-2"></i>Nueva Carpeta
                    </button>
                </div>
            </div>

            <!-- Buscador y Estadísticas -->
            <div class="flex items-center space-x-4">
                <div class="flex">
                    <input type="text" id="searchInput"
                           class="w-48 lg:w-64 px-4 py-2 bg-gray-700 border border-gray-600 rounded-l-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"
                           placeholder="Buscar archivos..."
                           onkeypress="if(event.key === 'Enter') searchFiles()">
                    <button onclick="searchFiles()"
                            class="bg-blue-600 px-4 py-2 rounded-r-lg hover:bg-blue-700 transition duration-200 flex items-center">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div class="hidden md:flex items-center space-x-2 text-sm bg-gray-700 px-3 py-2 rounded-lg">
                    <i class="fas fa-hdd text-blue-400"></i>
                    <span id="storageUsage">0 MB</span>
                </div>
            </div>

            <!-- Menú móvil -->
            <div class="md:hidden flex items-center">
                <button id="mobileMenuBtn" onclick="toggleMobileMenu()"
                        class="text-gray-400 hover:text-white">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Menú móvil desplegable -->
    <div id="mobileMenu" class="hidden md:hidden bg-gray-800 border-t border-gray-700 p-4 space-y-2">
        <button onclick="navigateTo(null); toggleMobileMenu()"
                class="w-full px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 hover:bg-blue-700 transition duration-200 flex items-center">
            <i class="fas fa-home mr-2"></i>Inicio
        </button>
        <button onclick="showUploadModal(); toggleMobileMenu()"
                class="w-full px-4 py-2 rounded-lg text-sm font-medium bg-green-600 hover:bg-green-700 transition duration-200 flex items-center">
            <i class="fas fa-file-upload mr-2"></i>Subir Archivo
        </button>
        <button onclick="showFolderModal(); toggleMobileMenu()"
                class="w-full px-4 py-2 rounded-lg text-sm font-medium bg-purple-600 hover:bg-purple-700 transition duration-200 flex items-center">
            <i class="fas fa-folder-plus mr-2"></i>Nueva Carpeta
        </button>
    </div>
</nav>
</body>
</html>
